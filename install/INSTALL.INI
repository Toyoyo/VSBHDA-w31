; INSTALL.INI for the GeosOne DOS Installer (INSTALL.EXE, from
; https://github.com/geosone/gdi, GPL version 3)
[Setup]
Title=VSBHDA Setup
Product=GeosOne VSBHDA 2.1
Id=VSBHDA
License=1,2,3
License1=VSBHDA|LICENSE.TXT
License2=HX runtime (HDPMI32i, JHDPMI)|HXRT.TXT
License3=Jemm (JLOAD, QPIEMU)|ARTISTIC.TXT
Readme=README.TXT
DefaultDir=%BOOT%\VSBHDA
; VSBHDA needs an XMS memory manager: 386MAX, QEMM, Jemm (JemmEx, or
; Jemm386 with HIMEM) or HIMEM
Need=?XMS|VSBHDA needs a memory manager in CONFIG.SYS: 386MAX, QEMM, JemmEx/Jemm386 or HIMEM. None is loaded.
MinDos=5.0
Done=VSBHDA is installed. Restart the computer. DOS games find the Sound Blaster at A220 I5 D1 H5 T6 (BLASTER); in Windows the sound card plays through VSBHDA.DRV.

[Welcome]
VSBHDA emulates a Sound Blaster (SB, SB Pro, SB16) with OPL3 FM music for
DOS games on today's sound hardware: Intel HDA, Intel ICH/AC97, VIA, SB Live
and Audigy, X-Fi, ES1370/1371, CS4281.

DOS: VSBHDA is started in AUTOEXEC.BAT, with what your memory manager
offers:
  386MAX      real-mode and 32-bit protected-mode games
  QEMM        real-mode and 32-bit protected-mode games (HDPMI32i)
  Jemm        real-mode and 32-bit protected-mode games (QPIEMU, HDPMI32i)
  HIMEM only  32-bit protected-mode games only (HDPMI32i)

Windows 3.1 enhanced mode: VSBVXD.386 gives DOS boxes the Sound Blaster
and Windows the wave, MIDI and volume driver VSBHDA.DRV.

[Options]
Option=on|DOS: start VSBHDA in AUTOEXEC.BAT (with the Windows part only with 386MAX or QEMM: VSBVXD unloads it)
Option=?CDA|DOS: CD audio through VSBHDA (SHSUCDX with /A:ON or /A:AUTO)| /CDA1
Option=!?JEMM|Windows 3.1: VSBVXD.386 and VSBHDA.DRV (not with Jemm: no enhanced mode)
Option=on|Windows 3.1: the MIDI Mapper plays General MIDI on VSBHDA
Option=on|Add the installation directory to the PATH (VSB, UNINST)

[Detect]
MAX=VSBCHK.COM /MAX
QEMM=VSBCHK.COM /QEMM
JEMM=VSBCHK.COM /JEMM
XMS=VSBCHK.COM /XMS
CDA=VSBCHK.COM /CDA

[Files]
VSBHDA.EXE
CS4281.DRV
ES1370.DRV
ES1371.DRV
HDA.DRV
ICH.DRV
SBGEN.DRV
SBXFI.DRV
VIA82.DRV
UNINST.EXE
VSBCHK.COM
VSBMAP.COM
?MAX|VSBMAX.BAT=VSB.BAT
!?MAX,?QEMM|VSBQEMM.BAT=VSB.BAT
!?MAX,!?QEMM,?JEMM|VSBJEMM.BAT=VSB.BAT
!?MAX,!?QEMM,!?JEMM|VSBXMS.BAT=VSB.BAT
HDPMI32I.EXE
JHDPMI.DLL
QPIEMU.DLL
JLOAD.EXE
README.TXT
VSBHDA.TXT
VSBVXD.TXT
LICENSE.TXT
HXRT.TXT
ARTISTIC.TXT
3|VSBVXD.386=%WINDIR%\SYSTEM\
3|VSBHDA.DRV=%WINDIR%\SYSTEM\
3|OEMSETUP.INF

; VSB.BAT (the variant for the memory manager) starts VSBHDA. Windows
; enhanced mode doesn't start while VSBHDA is loaded; VSBVXD unloads it
; through its port trapping, which VSBHDA has with 386MAX and QEMM only (Jemm
; can't run enhanced mode, with HIMEM VSBHDA runs /RM0)
[Autoexec.bat]
Remove=VSBHDA.EXE
Remove=HDPMI32I.EXE
Remove=QPIEMU.DLL
Remove=JHDPMI.DLL
Remove=VSB.BAT
Remove=SET VSBHDA=
Remove=SET BLASTER=
Add=SET VSBHDA=%DIR%
Add=SET BLASTER=A220 I5 D1 H5 T6 P330
Add=1,!3|CALL %DIR%\VSB.BAT%O2%
Add=1,3,?MAX|CALL %DIR%\VSB.BAT%O2%
Add=1,3,!?MAX,?QEMM|CALL %DIR%\VSB.BAT%O2%
PathAppend=5|%DIR%
Position=bottom

; Windows 3.1 enhanced mode; Microsoft's Sound Blaster VxD traps the same
; ports
[System.ini]
Remove=vsbvxd.386
Remove=device=vsbd.386
Add=3|386Enh|device=vsbvxd.386
Set=3|drivers|wave=vsbhda.drv
Set=3|drivers|midi=vsbhda.drv
Set=3|drivers|aux=vsbhda.drv

[Run]
After=3,4,?%WINDIR%\SYSTEM\MIDIMAP.CFG|%DIR%\VSBMAP.COM %WINDIR%
Uninstall=?%WINDIR%\SYSTEM\MIDIMAP.VSB|%DIR%\VSBMAP.COM %WINDIR% /U
